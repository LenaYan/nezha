[project]
name = "nezha"
version = "0.1.0"
description = "Orchestrator that runs GitHub Copilot CLI agents on tracker issues inside isolated, sandboxed worktrees."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
nezha = "nezha.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nezha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
